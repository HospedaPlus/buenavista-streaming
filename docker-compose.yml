# F2 completo con un solo comando:  docker compose up -d --build
#   kafka          -> broker local (los contenedores lo ven en kafka:29092, tu PC en localhost:9092)
#   kafka-init     -> crea los topics una vez y termina
#   neon-migrate   -> aplica migrations/*.sql en Neon con el usuario dueño y termina
#   producer       -> stream continuo de eventos F2 (5 ev/s, picos de 15 ev/s)
#   neon-consumer  -> lee Kafka y guarda en streaming.reservation_event_ledger como app_writer
# Requiere en .env: NEON_DATABASE_URL (app_writer) y NEON_OWNER_URL (hospedaplus_owner).
services:
  kafka:
    image: apache/kafka:4.1.1
    container_name: buenavista-streaming-kafka
    hostname: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,INTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  kafka-init:
    image: apache/kafka:4.1.1
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        K=/opt/kafka/bin/kafka-topics.sh
        $$K --bootstrap-server kafka:29092 --create --if-not-exists --topic reservation.events.v1_3 --partitions 3 --replication-factor 1
        $$K --bootstrap-server kafka:29092 --create --if-not-exists --topic reservation.events.dlq --partitions 1 --replication-factor 1
        echo "Topics listos"
    restart: "no"

  neon-migrate:
    image: postgres:16-alpine
    environment:
      NEON_OWNER_URL: ${NEON_OWNER_URL:?Falta NEON_OWNER_URL en .env (usuario hospedaplus_owner)}
    volumes:
      - ./migrations:/migrations:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        for f in /migrations/*.sql; do
          echo "Aplicando $$f"
          psql "$$NEON_OWNER_URL" -v ON_ERROR_STOP=1 -q -f "$$f"
        done
        echo "Migraciones listas"
    restart: "no"

  producer:
    build: .
    image: buenavista-streaming:local
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_RESERVATION_TOPIC: reservation.events.v1_3
    command: ["python", "-m", "src.kafka_producer", "--continuous"]
    restart: unless-stopped

  neon-consumer:
    build: .
    image: buenavista-streaming:local
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      neon-migrate:
        condition: service_completed_successfully
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_RESERVATION_TOPIC: reservation.events.v1_3
      KAFKA_DLQ_TOPIC: reservation.events.dlq
      KAFKA_NEON_GROUP_ID: buenavista-neon-ledger
      NEON_DATABASE_URL: ${NEON_DATABASE_URL:?Falta NEON_DATABASE_URL en .env (usuario app_writer)}
    command: ["python", "-m", "src.neon_consumer"]
    restart: unless-stopped

volumes:
  kafka_data:
