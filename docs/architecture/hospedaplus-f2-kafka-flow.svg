<path d="M890 627 H903" stroke="#43835B" stroke-width="3" marker-end="url(#arrow-green)"/>
<path d="M1138 627 H1149" stroke="#43835B" stroke-width="3" marker-end="url(#arrow-green)"/>
<path d="M1326 627 H1337" stroke="#43835B" stroke-width="3" marker-end="url(#arrow-green)"/>
<path d="M1506 627 H1517" stroke="#43835B" stroke-width="3" marker-end="url(#arrow-green)"/>
<path d="M1674 627 H1683" stroke="#BB8730" stroke-width="3" marker-end="url(#arrow-gold)"/>
<text x="952" y="744" class="tiny">Raw bronze first · scheduled transforms after ingestion · offsets only after durable writes</text>
<rect x="40" y="808" width="602" height="42" rx="14" fill="#E8EDF4"/>
<text x="341" y="834" text-anchor="middle" font-size="13" font-weight="650" fill="#445873">🔒 Synthetic guest data · TLS/SASL at deployment · least-privilege access</text>
<text x="950" y="891" text-anchor="middle" font-size="12" fill="#75849A">HospedaPlus · proposed deployment target · not a production deployment</text>
